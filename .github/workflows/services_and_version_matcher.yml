name: Services and Version Matcher CI

on:
  workflow_call:
    inputs:
      run-google-services:
        type: boolean
        default: true
      run-strict-version-matcher:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-strict-version-matcher:
    name: Build strict version matcher plugin
    if: inputs.run-strict-version-matcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # ratchet:actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # ratchet:gradle/actions/setup-gradle@v6.3.0
        with:
          dependency-graph: generate-and-submit

      - name: Perform a Gradle build
        run: ./gradlew build
        working-directory: ./strict-version-matcher-plugin

  build-google-services:
    name: Build google services plugin
    if: inputs.run-google-services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # ratchet:actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # ratchet:gradle/actions/setup-gradle@v6.3.0
        with:
          dependency-graph: generate-and-submit

      - name: Perform a Gradle build
        run: ./gradlew build
        working-directory: ./google-services-plugin
