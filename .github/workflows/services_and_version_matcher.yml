name: Services and Version Matcher CI

on:
  workflow_call:
    inputs:
      run-google-services:
        type: boolean
        default: true
      run-strict-version-matcher:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-strict-version-matcher:
    name: Build strict version matcher plugin
    if: inputs.run-strict-version-matcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # ratchet:actions/setup-java@v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # ratchet:gradle/actions/setup-gradle@v6.4.1
        with:
          dependency-graph: generate-and-submit

      - name: Perform a Gradle build
        run: ./gradlew build
        working-directory: ./strict-version-matcher-plugin

  build-google-services:
    name: Build google services plugin
    if: inputs.run-google-services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # ratchet:actions/setup-java@v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # ratchet:gradle/actions/setup-gradle@v6.4.1
        with:
          dependency-graph: generate-and-submit

      - name: Perform a Gradle build
        run: ./gradlew build
        working-directory: ./google-services-plugin
