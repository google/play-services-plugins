name: Services and Version Matcher CI

on:
  workflow_call:
    inputs:
      run-google-services:
        type: boolean
        default: true
      run-strict-version-matcher:
        type: boolean
        default: true

jobs:
  build-strict-version-matcher:
    if: inputs.run-strict-version-matcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # ratchet:actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # ratchet:gradle/actions/setup-gradle@v6.2.0
        with:
          dependency-graph: generate-and-submit

      - name: Perform a Gradle build
        run: ./gradlew build
        working-directory: ./strict-version-matcher-plugin

  build-google-services:
    if: inputs.run-google-services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # ratchet:actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # ratchet:gradle/actions/setup-gradle@v6.2.0
        with:
          dependency-graph: generate-and-submit

      - name: Perform a Gradle build
        run: ./gradlew build
        working-directory: ./google-services-plugin
